# Tests the template itself: generate every use_spa × use_orgs combination and run the
# generated project's checks. (Generated projects get their own CI from template/.)
name: Template

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generate-and-check:
    name: spa=${{ matrix.use_spa }} orgs=${{ matrix.use_orgs }} db=${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { use_spa: true, use_orgs: true, database: accessory }
          - { use_spa: true, use_orgs: false, database: external }
          - { use_spa: false, use_orgs: true, database: external }
          - { use_spa: false, use_orgs: false, database: accessory }
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_project
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Matches the default project_name ("My Project" -> slug my-project -> my_project).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/my_project
      PROJECT_DIR: ${{ github.workspace }}/../generated
    steps:
      - uses: actions/checkout@v7
        with:
          # Copier renders from git (--vcs-ref HEAD), so give it full history.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3

      - uses: actions/setup-node@v7
        if: matrix.use_spa
        with:
          node-version: 22

      - name: Generate project
        run: >-
          uvx copier copy --defaults --vcs-ref HEAD
          -d use_spa=${{ matrix.use_spa }}
          -d use_orgs=${{ matrix.use_orgs }}
          -d database=${{ matrix.database }}
          . "$PROJECT_DIR"

      # DATABASE_URL points at the postgres service, so this exercises the "Postgres already
      # reachable, no Docker" path. Fail if bin/setup started Docker Compose instead.
      - name: bin/setup
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          bin/setup | tee setup.log
          grep -q "Using existing Postgres" setup.log

      - name: bin/setup again (idempotent)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          bin/setup | tee setup-again.log
          grep -q ".env exists (left unchanged)" setup-again.log
          grep -q "Database my_project exists" setup-again.log

      - name: ruff check
        working-directory: ${{ env.PROJECT_DIR }}
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: ${{ env.PROJECT_DIR }}
        run: uv run ruff format --check .

      - name: basedpyright
        working-directory: ${{ env.PROJECT_DIR }}
        run: uv run basedpyright

      - name: makemigrations --check
        working-directory: ${{ env.PROJECT_DIR }}
        run: uv run python manage.py makemigrations --check --dry-run

      - name: pytest
        working-directory: ${{ env.PROJECT_DIR }}
        run: uv run pytest

      - name: npm ci
        if: matrix.use_spa
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        run: npm ci

      - name: npm run build
        if: matrix.use_spa
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        run: npm run build

      - name: npm run typecheck
        if: matrix.use_spa
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        run: npm run typecheck
