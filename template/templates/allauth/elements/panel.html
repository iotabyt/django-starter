{% load allauth %}
<section class="rounded-lg border border-gray-200 p-5 dark:border-gray-800">
  <h2>{% slot title %}{% endslot %}</h2>
  <div class="mt-2 space-y-4 text-sm text-gray-600 dark:text-gray-400">
    {% slot body %}
    {% endslot %}
  </div>
  {% if slots.actions %}
    <div class="mt-4 flex flex-wrap gap-3">
      {% for action in slots.actions %}{{ action }}{% endfor %}
    </div>
  {% endif %}
</section>
