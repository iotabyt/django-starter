{% load allauth %}
<form method="{{ attrs.method }}"
      {% if attrs.action %}action="{{ attrs.action }}"{% endif %}>
  {% slot body %}
  {% endslot %}
  {% if slots.actions %}
    <div class="flex flex-wrap items-center gap-3 pt-1">
      {% slot actions %}
      {% endslot %}
    </div>
  {% endif %}
</form>
